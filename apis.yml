aid: kibin
name: Kibin
description: >-
  Kibin is a consumer study and academic-writing company operating at kibin.com,
  trusted by students since 2011. Its newest product is an AI-powered study
  partner (iOS app) that turns lectures, notes, PDFs, and YouTube videos into
  personalized study guides, quizzes, flashcards, transcripts, and explanations
  to help students learn faster and build mastery. Alongside the study app,
  Kibin also runs its long-standing academic-writing surface — professional
  essay editing, a paper grader, a thesis-statement generator, essay examples,
  and a writing blog. Kibin is a B2C, mobile- and web-delivered product with no
  public developer API, SDK, or developer portal at this time; it is tracked in
  the API Evangelist network as a portfolio company of 500 Global.
